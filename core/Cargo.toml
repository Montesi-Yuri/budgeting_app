[package]
name = "budget-core"
description = "Data, write path, sync log and domain logic of the budgeting app (no UI, no Tauri)"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
serde_bytes = "0.11"
thiserror = "2"
csv = "1.4.0"
encoding_rs = "0.8.44"
sha2 = "0.10"
age = "0.11"
snow = { version = "0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
base64 = "0.23.1"
if-addrs = "0.15.0"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
