[package]
name = "budgeting-app"
description = "Personal budgeting app (Tauri shell: window, commands, app paths)"
version.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "budgeting_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
budget-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }

# The phone build: the camera QR code scanner for Pairing (ticket 15).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
